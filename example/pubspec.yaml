name: dart_math_example
description: Standalone host for the visual_math package.
publish_to: none
version: 1.0.0+1

environment:
  sdk: '>=3.13.7 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  visual_math:
    path: ..

flutter:
  uses-material-design: true
dependency_overrides:
  # This standalone example workaround does not change consumers' dependency resolution.
  # 1.1.3 uses the legacy proguard-android.txt, rejected by current Android Gradle.
  # Upstream 1.2.0-beta.3 switches to proguard-android-optimize.txt.
  flutter_inappwebview_android: 1.2.0-beta.3
