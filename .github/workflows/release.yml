name: Release Build

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing GitHub Release tag to attach rebuilt example assets to
        required: true
        type: string

concurrency:
  group: release-example-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build-example:
    uses: ./.github/workflows/build-example.yml
    permissions:
      contents: read
    with:
      ref: ${{ github.event.release.tag_name || inputs.tag }}

  upload-release-assets:
    name: Upload example builds to GitHub Release
    needs: build-example
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: example-*
          path: release-assets
          merge-multiple: true
      - name: Verify target release
        run: gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY"
      - name: Upload build assets
        run: gh release upload "$RELEASE_TAG" release-assets/* --repo "$GITHUB_REPOSITORY" --clobber
