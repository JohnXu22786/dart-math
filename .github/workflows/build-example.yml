name: Build standalone example

on:
  workflow_call:
    inputs:
      ref:
        description: Git ref to build
        required: false
        type: string

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.label }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Linux x64 (formula preview fallback)
            artifact: linux-x64
            runner: ubuntu-latest
            platform: linux
            target: linux
            build_args: ''
          - label: Web
            artifact: web
            runner: ubuntu-latest
            target: web
            platform: none
            build_args: ''
          - label: Android APK
            artifact: android-apk
            runner: ubuntu-latest
            platform: android
            target: apk
            build_args: ''
          - label: Windows x64
            artifact: windows-x64
            runner: windows-latest
            platform: windows
            target: windows
            build_args: ''
          - label: macOS ARM64
            artifact: macos-arm64
            runner: macos-15
            platform: macos
            target: macos
            arch: arm64
            build_args: ''
          - label: macOS x64
            artifact: macos-x64
            runner: macos-15
            platform: macos
            target: macos
            arch: x86_64
            build_args: ''
          - label: unsigned iOS
            artifact: ios-unsigned
            runner: macos-15
            platform: ios
            target: ios
            build_args: --no-codesign
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.8
          cache: true
          pub-cache: true
      - if: matrix.runner == 'ubuntu-latest' && matrix.platform == 'linux'
        name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libwebkit2gtk-4.1-dev libsecret-1-dev
      - if: matrix.target == 'apk'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - if: matrix.platform != 'none'
        name: Generate ${{ matrix.platform }} host scaffolding
        working-directory: example
        run: flutter create --platforms=${{ matrix.platform }} .
      - name: Resolve example dependencies
        working-directory: example
        run: flutter pub get
      - name: Build example
        working-directory: example
        shell: bash
        run: |
          set +e
          flutter build ${{ matrix.target }} --release ${{ matrix.build_args }} 2>&1 | tee "$RUNNER_TEMP/flutter-build.log"
          build_status=${PIPESTATUS[0]}
          if [ "$build_status" -ne 0 ]; then
            {
              echo '### ${{ matrix.label }} build diagnostics'
              echo
              echo '```text'
              grep -Ei '(^|[[:space:]])(error|fatal|exception|failed|failure|cannot|could not|unable to)(:|[[:space:]])|error:' "$RUNNER_TEMP/flutter-build.log" \
                | tail -n 80 \
                | sed -E 's#(/home/runner/work/[^[:space:]]*|/Users/runner/work/[^[:space:]]*|[A-Z]:\\a\\[^[:space:]]*)#<build-path>#g'
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          exit "$build_status"
        env:
          FLUTTER_XCODE_ARCHS: ${{ matrix.arch }}
      - if: matrix.target == 'linux'
        name: Archive Linux build
        working-directory: example
        run: |
          cd build/linux/x64/release/bundle
          zip -r "$GITHUB_WORKSPACE/example-linux-x64.zip" .
      - if: matrix.target == 'web'
        name: Archive Web build
        working-directory: example
        run: |
          cd build/web
          zip -r "$GITHUB_WORKSPACE/example-web.zip" .
      - if: matrix.target == 'apk'
        name: Stage Android APK
        working-directory: example
        run: cp build/app/outputs/flutter-apk/app-release.apk "$GITHUB_WORKSPACE/example-android-apk.apk"
      - if: matrix.target == 'windows'
        name: Archive Windows build
        shell: pwsh
        working-directory: example
        run: Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath "$env:GITHUB_WORKSPACE/example-windows-x64.zip"
      - if: matrix.target == 'macos'
        name: Archive macOS build
        working-directory: example
        run: |
          app_path="$(find build/macos/Build/Products/Release -maxdepth 1 -type d -name '*.app' -print -quit)"
          if [ -z "$app_path" ]; then
            echo "No macOS app bundle was produced under build/macos/Build/Products/Release."
            find build/macos/Build/Products/Release -maxdepth 2 -print
            exit 1
          fi
          ditto -c -k --keepParent "$app_path" "$GITHUB_WORKSPACE/example-${{ matrix.artifact }}.zip"
      - if: matrix.target == 'ios'
        name: Package unsigned iOS app
        working-directory: example
        run: |
          app_path="$(find build/ios/iphoneos -maxdepth 1 -type d -name '*.app' -print -quit)"
          if [ -z "$app_path" ]; then
            echo "No iOS app bundle was produced under build/ios/iphoneos."
            find build/ios -maxdepth 4 -print
            exit 1
          fi
          mkdir -p build/ios/ipa/Payload
          cp -R "$app_path" build/ios/ipa/Payload/
          cd build/ios/ipa
          zip -r "$GITHUB_WORKSPACE/example-ios-unsigned.ipa" Payload/
      - uses: actions/upload-artifact@v4
        with:
          name: example-${{ matrix.artifact }}
          path: example-${{ matrix.artifact }}.*
          if-no-files-found: error
          retention-days: 7
