name: Build standalone example

on:
  workflow_call:
    inputs:
      ref:
        description: Git ref to build
        required: false
        type: string

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.label }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Linux x64 (formula preview fallback)
            artifact: linux-x64
            runner: ubuntu-latest
            platform: linux
            target: linux
            build_args: ''
          - label: Web
            artifact: web
            runner: ubuntu-latest
            target: web
            platform: none
            build_args: ''
          - label: Android APK
            artifact: android-apk
            runner: ubuntu-latest
            platform: android
            target: apk
            build_args: ''
          - label: Windows x64
            artifact: windows-x64
            runner: windows-latest
            platform: windows
            target: windows
            build_args: ''
          - label: macOS ARM64
            artifact: macos-arm64
            runner: macos-15
            platform: macos
            target: macos
            arch: arm64
            build_args: ''
          - label: macOS x64
            artifact: macos-x64
            runner: macos-15
            platform: macos
            target: macos
            arch: x86_64
            build_args: ''
          - label: unsigned iOS
            artifact: ios-unsigned
            runner: macos-15
            platform: ios
            target: ios
            build_args: --no-codesign
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.8
          cache: true
          pub-cache: true
      - if: matrix.runner == 'ubuntu-latest' && matrix.platform == 'linux'
        name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libwebkit2gtk-4.1-dev libsecret-1-dev
      - if: matrix.target == 'apk'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - if: matrix.platform != 'none'
        name: Generate ${{ matrix.platform }} host scaffolding
        working-directory: example
        run: flutter create --platforms=${{ matrix.platform }} .
      - if: matrix.target == 'windows'
        name: Set Windows WebView coroutine compatibility define
        working-directory: example
        shell: bash
        run: |
          python - <<'PYTHON'
          from pathlib import Path
          import re

          cmake_file = Path('windows/CMakeLists.txt')
          cmake_text, replacements = re.subn(
              r'(?m)^([ \t]*add_subdirectory\(\$\{FLUTTER_MANAGED_DIR\}\)[ \t]*)$',
              r'# MSVC 14.51 rejects the WebView plugin experimental coroutine header.\nadd_definitions(-D_SILENCE_EXPERIMENTAL_COROUTINE_DEPRECATION_WARNINGS)\n\1',
              cmake_file.read_text(),
          )
          if replacements != 1:
              raise SystemExit('Expected one add_subdirectory(${FLUTTER_MANAGED_DIR}) in windows/CMakeLists.txt.')
          cmake_file.write_text(cmake_text)
          PYTHON
      - if: matrix.target == 'apk'
        name: Pin Android Gradle versions for the stable WebView plugin
        working-directory: example
        shell: bash
        run: |
          python3 - <<'PYTHON'
          from pathlib import Path
          import re

          settings = Path('android/settings.gradle.kts')
          settings_text = settings.read_text()
          settings_text, agp_replacements = re.subn(
              r'(id\("com\.android\.application"\) version ")9\.1\.0(")',
              r'\g<1>8.13.2\g<2>',
              settings_text,
          )
          if agp_replacements != 1:
              raise SystemExit('Expected one Flutter 3.47.8 Android Gradle Plugin version in android/settings.gradle.kts.')
          wrapper = Path('android/gradle/wrapper/gradle-wrapper.properties')
          wrapper_text, gradle_replacements = re.subn(
              r'(distributionUrl=.*gradle-)9\.3\.1(-all\.zip)',
              r'\g<1>8.14.3\g<2>',
              wrapper.read_text(),
          )
          if gradle_replacements != 1:
              raise SystemExit('Expected one Flutter 3.47.8 Gradle wrapper version.')
          settings.write_text(settings_text)
          wrapper.write_text(wrapper_text)
          PYTHON
      - name: Resolve example dependencies
        working-directory: example
        run: flutter pub get
      - name: Build example
        id: build_example
        working-directory: example
        shell: bash
        run: |
          set +e
          flutter build ${{ matrix.target }} --release ${{ matrix.build_args }} 2>&1 | tee "$RUNNER_TEMP/flutter-build.log"
          build_status=${PIPESTATUS[0]}
          if [ "$build_status" -ne 0 ]; then
            filter_future_swiftpm_notice() {
              awk '
                BEGIN { in_notice = 0 }
                {
                  line = tolower($0)
                  if (line ~ /error:|error c[0-9]+|swift compiler error|swiftcompile.*error|error \(xcode\)|undefined symbols|linker command failed/) {
                    in_notice = 0
                    print
                    next
                  }
                  if (line ~ /(fatal|failed|cannot|could not)/ &&
                      line !~ /future.*(version|release)/ &&
                      line !~ /will become (a )?(fatal )?error/ &&
                      line !~ /will be (a )?(fatal )?error/) {
                    in_notice = 0
                    print
                    next
                  }
                  if (!in_notice && line ~ /(swift package manager|swiftpm|cocoapods|(^|[^[:alnum:]])spm([^[:alnum:]]|$))/ &&
                      line ~ /(not support|unsupported|not compatible|future|will become an error|deprecated)/) {
                    in_notice = 1
                    next
                  }
                  if (line ~ /(will become|will be).*(fatal )?error/ ||
                      line ~ /^[[:space:]]*(in|for) a future (version|release)/) {
                    in_notice = 0
                    next
                  }
                  if (line ~ /contact.*plugin maintainers/ &&
                      line ~ /(swift package manager|swiftpm|(^|[^[:alnum:]])spm([^[:alnum:]]|$))/) {
                    next
                  }
                  if (in_notice) {
                    if (line ~ /future.*(version|release)/ || line ~ /will become an error/ || line ~ /deprecated.*future/) {
                      in_notice = 0
                      next
                    }
                    if (line ~ /(^|[[:space:]])(error|failed|fatal|undefined symbols|cannot|could not)(:|[[:space:]]|$)/) {
                      in_notice = 0
                    }
                    if ($0 ~ /^[[:space:]]*$/ || $0 ~ /^[[:space:]]*--[[:space:]]*$/ ||
                        $0 ~ /^[[:space:]]*[-*][[:space:]]*[[:alnum:]_.+-]+[[:space:]]*$/ ||
                        $0 ~ /^[[:space:]]*[[:alnum:]_][[:alnum:]_.+-]*[[:space:]]*$/ ||
                        line ~ /(swift package manager|swiftpm|cocoapods|(^|[^[:alnum:]])spm([^[:alnum:]]|$)|plugin|support|warning)/) {
                      next
                    }
                    in_notice = 0
                  }
                  print
                }
              '
            }
            diagnostic_log="$RUNNER_TEMP/flutter-build.log"
            if [ "${{ matrix.target }}" = 'ios' ]; then
              diagnostic_log="$RUNNER_TEMP/flutter-build-filtered.log"
              filter_future_swiftpm_notice < "$RUNNER_TEMP/flutter-build.log" > "$diagnostic_log"
            fi
            diagnostics_file="$RUNNER_TEMP/platform-build-diagnostics.txt"
            {
              grep -Ei -B 2 -A 3 '(^|[[:space:]])(error|fatal|exception|failed|failure|cannot|could not|unable to|what went wrong|a problem occurred|execution failed|caused by|exited with status code|swift compiler|swiftcompile|linker command failed|undefined symbols|cmake error|compiler test)(:|[[:space:]])|error:|\[!\]|C2338|STL1011' "$diagnostic_log" \
                | head -n 40
              tail -n 40 "$diagnostic_log"
            } \
              | tail -n 80 \
              | tr -d '\000-\010\013\014\016-\037\177' \
              | "$DIAGNOSTICS_PYTHON" -c '
          import re, sys

          unix_paths = re.compile(r"(/home/runner/work/[^\s]+|/Users/runner/work/[^\s]+)")
          windows_paths = re.compile(r"""(?<![A-Za-z0-9])([A-Za-z]:[\\/][^:\"<>|?]*)""")
          for line in sys.stdin:
              line = unix_paths.sub("<build-path>", line)
              line = windows_paths.sub("<build-path>", line)
              has_newline = line.endswith("\n")
              line = line[:-1] if has_newline else line
              sys.stdout.write(line[:1000] + ("\n" if has_newline else ""))
          ' \
              > "$diagnostics_file"
            {
              echo '### ${{ matrix.label }} build diagnostics'
              echo
              fence=$'\x60\x60\x60'
              while grep -Fq "$fence" "$diagnostics_file"; do
                fence+=$'\x60'
              done
              printf '%stext\n' "$fence"
              cat "$diagnostics_file"
              printf '%s\n' "$fence"
            } >> "$GITHUB_STEP_SUMMARY"
            annotation_file="$RUNNER_TEMP/platform-build-annotations.txt"
            grep -Ei -B 2 -A 3 'what went wrong|a problem occurred|execution failed|caused by|fatal error|error:|error C[0-9]+|C2338|STL1011|CMake Error|linker command failed|undefined symbols' "$diagnostics_file" \
              | head -n 10 > "$annotation_file"
            if [ ! -s "$annotation_file" ]; then
              grep -Ei -B 2 -A 3 '(^|[[:space:]])(error|fatal|exception|failed|failure|cannot|could not|unable to|exited with status code|swift compiler|swiftcompile|compiler test)(:|[[:space:]])|\[!\]' "$diagnostics_file" \
                | head -n 10 > "$annotation_file"
            fi
            if [ ! -s "$annotation_file" ]; then
              tail -n 10 "$diagnostics_file" > "$annotation_file"
            fi
            annotation_count=0
            while IFS= read -r diagnostic || [ -n "$diagnostic" ]; do
              if [ "$annotation_count" -ge 10 ]; then
                break
              fi
              diagnostic="${diagnostic:0:1000}"
              escaped=${diagnostic//'%'/'%25'}
              escaped=${escaped//$'\r'/'%0D'}
              escaped=${escaped//$'\n'/'%0A'}
              printf '::error::%s\n' "$escaped"
              annotation_count=$((annotation_count + 1))
            done < "$annotation_file"
          fi
          exit "$build_status"
        env:
          FLUTTER_XCODE_ARCHS: ${{ matrix.arch }}
          DIAGNOSTICS_PYTHON: ${{ matrix.target == 'windows' && 'python' || 'python3' }}
      - name: Upload sanitized build diagnostics
        if: failure() && steps.build_example.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}-build-diagnostics
          path: ${{ runner.temp }}/platform-build-diagnostics.txt
          if-no-files-found: error
          retention-days: 3
      - if: matrix.target == 'linux'
        name: Archive Linux build
        working-directory: example
        run: |
          cd build/linux/x64/release/bundle
          zip -r "$GITHUB_WORKSPACE/example-linux-x64.zip" .
      - if: matrix.target == 'web'
        name: Archive Web build
        working-directory: example
        run: |
          cd build/web
          zip -r "$GITHUB_WORKSPACE/example-web.zip" .
      - if: matrix.target == 'apk'
        name: Stage Android APK
        working-directory: example
        run: cp build/app/outputs/flutter-apk/app-release.apk "$GITHUB_WORKSPACE/example-android-apk.apk"
      - if: matrix.target == 'windows'
        name: Archive Windows build
        shell: pwsh
        working-directory: example
        run: Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath "$env:GITHUB_WORKSPACE/example-windows-x64.zip"
      - if: matrix.target == 'macos'
        name: Archive macOS build
        working-directory: example
        run: |
          app_path="$(find build/macos/Build/Products/Release -maxdepth 1 -type d -name '*.app' -print -quit)"
          if [ -z "$app_path" ]; then
            echo "No macOS app bundle was produced under build/macos/Build/Products/Release."
            find build/macos/Build/Products/Release -maxdepth 2 -print
            exit 1
          fi
          ditto -c -k --keepParent "$app_path" "$GITHUB_WORKSPACE/example-${{ matrix.artifact }}.zip"
      - if: matrix.target == 'ios'
        name: Package unsigned iOS app
        working-directory: example
        run: |
          app_path="$(find build/ios/iphoneos -maxdepth 1 -type d -name '*.app' -print -quit)"
          if [ -z "$app_path" ]; then
            echo "No iOS app bundle was produced under build/ios/iphoneos."
            find build/ios -maxdepth 4 -print
            exit 1
          fi
          mkdir -p build/ios/ipa/Payload
          cp -R "$app_path" build/ios/ipa/Payload/
          cd build/ios/ipa
          zip -r "$GITHUB_WORKSPACE/example-ios-unsigned.ipa" Payload/
      - uses: actions/upload-artifact@v4
        with:
          name: example-${{ matrix.artifact }}
          path: example-${{ matrix.artifact }}.*
          if-no-files-found: error
          retention-days: 7
