name: CI Checks

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}-${{ github.run_id }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  dart:
    name: Format and analyze package and example
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.8
          cache: true
          pub-cache: true
      - name: Resolve package dependencies
        run: flutter pub get
      - name: Resolve example dependencies
        working-directory: example
        run: flutter pub get
      - name: Check Dart formatting
        run: dart format --output=none --set-exit-if-changed lib example/lib
      - name: Analyze package
        run: flutter analyze --no-fatal-warnings --no-fatal-infos
      - name: Analyze example
        working-directory: example
        run: flutter analyze --no-fatal-warnings --no-fatal-infos

  example-web:
    name: Build standalone example for Web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.8
          cache: true
          pub-cache: true
      - name: Resolve example dependencies
        working-directory: example
        run: flutter pub get
      - name: Build example
        working-directory: example
        run: flutter build web --release
