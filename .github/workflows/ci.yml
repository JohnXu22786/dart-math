name: CI Checks

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}-${{ github.run_id }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  dart:
    name: Format and analyze package and example
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.8
          cache: true
          pub-cache: true
      - name: Resolve package dependencies
        run: flutter pub get
      - name: Resolve example dependencies
        working-directory: example
        run: flutter pub get
      - name: Check changed Dart formatting
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          BASE_SHA="$PR_BASE_SHA"
          if [ -z "$BASE_SHA" ]; then
            BASE_SHA="$(git merge-base origin/main HEAD)"
          fi
          mapfile -d '' -t dart_files < <(
            git diff --diff-filter=ACMRT --name-only -z "$BASE_SHA"...HEAD -- '*.dart'
          )
          if [ "${#dart_files[@]}" -eq 0 ]; then
            echo "No changed Dart files to format-check."
            exit 0
          fi
          dart format --output=none --set-exit-if-changed "${dart_files[@]}"
      - name: Analyze package
        run: flutter analyze --no-fatal-warnings --no-fatal-infos
      - name: Analyze example
        working-directory: example
        run: flutter analyze --no-fatal-warnings --no-fatal-infos

  example-web:
    name: Build standalone example for Web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.8
          cache: true
          pub-cache: true
      - name: Resolve example dependencies
        working-directory: example
        run: flutter pub get
      - name: Build example
        working-directory: example
        run: flutter build web --release

  package-test:
    name: Test package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.8
          cache: true
          pub-cache: true
      - name: Resolve package dependencies
        run: flutter pub get
      - name: Run package tests
        run: flutter test

  mathlive-bridge-test:
    name: Test MathLive JavaScript bridge
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.8
          cache: true
          pub-cache: true
      - name: Resolve package dependencies
        run: flutter pub get
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tools/math_editor_test/package-lock.json
      - name: Install JavaScript test dependencies
        working-directory: tools/math_editor_test
        run: npm ci
      - name: Run MathLive bridge tests
        working-directory: tools/math_editor_test
        run: npm test
